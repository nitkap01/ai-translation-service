[project]
name = "ai-translation-service"
version = "0.1.0"
description = "Speech and text translation with spoken output, powered by Whisper large-v3, NLLB-200, and MMS-TTS."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
